name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: bash -n tunlet scripts/*.sh
      - name: Run supervisor unit tests
        run: |
          rustc --edition=2021 --test scripts/supervisor.rs -o /tmp/tunlet-tests
          /tmp/tunlet-tests

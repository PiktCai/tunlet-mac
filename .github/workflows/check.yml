name: 检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 shell 语法
        run: bash -n atrust scripts/*.sh
      - name: 运行 supervisor 单元测试
        run: |
          rustc --edition=2021 --test scripts/atrust-lite-supervisor.rs -o /tmp/atrust-lite-tests
          /tmp/atrust-lite-tests
